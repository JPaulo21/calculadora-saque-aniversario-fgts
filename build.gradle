buildscript {
	repositories {
		mavenCentral()
		gradlePluginPortal()  // ← necessário para plugins do Gradle
	}
	dependencies {
		classpath 'org.flywaydb:flyway-database-postgresql:11.7.2'
		classpath 'org.postgresql:postgresql:42.7.8'
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.flywaydb.flyway' version '11.7.2'
	id 'jacoco'
}

group = 'com.jp'
version = '0.1'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}


// JaCoCo
jacoco {
	toolVersion = "0.8.14"
}

jacocoTestReport {
	dependsOn(test)

	reports {
		xml.required = true
	}
}

jacocoTestCoverageVerification {
	dependsOn(jacocoTestReport)

	violationRules {
		rule {
			element = 'CLASS'
			includes = ['com.jp.calculadora_saque_aniversario_fgts.*']
			excludes = ['com.jp.calculadora_saque_aniversario_fgts.*Application',
						'com.jp.calculadora_saque_aniversario_fgts.infra.*',
						'com.jp.calculadora_saque_aniversario_fgts.web.exception.*',
						'com.jp.calculadora_saque_aniversario_fgts.web.dto.*']

			limit {
				counter = 'LINE'
				value   = 'COVEREDRATIO'
				minimum = 0.7
			}
		}
	}
}

check.dependsOn jacocoTestCoverageVerification

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

// Flyway

// Necessário configurar o Flyway
flyway {
	url      = 'jdbc:postgresql://localhost:5432/saque-aniversario-fgts'
	user     = 'postgres'
	password = '123'
	schemas  = ['public', 'withdraw']
	locations = ['classpath:db/migration']  // - Onde ficam os scripts V001__, V002__...
	// baselineOnMigrate = true                //- Banco já existe com tabelas → Flyway cria o flyway_schema_history
												// marca tudo que já existe como "baseline" (versão 1)
												// a partir daí só aplica migrations novas
	outOfOrder        = false               // - Não permite rodar migrations fora de ordem
	validateOnMigrate = true                // - Valida checksum dos scripts ao migrar
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-database-postgresql'
    implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.9")
	implementation 'org.mapstruct:mapstruct:1.6.3'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'com.h2database:h2'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
